<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#sGrad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Glowing Heartbeat background pulse -->
  <path d="M10 32h10l3-5 5 11 4-9 3 5 4-2h15" stroke="url(#sGrad)" stroke-width="1.2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>

  <!-- High-Tech Monogram 'S' with sharp modern aesthetic -->
  <path d="M42 20.5C39.8 17.5 35.8 16 31 16c-7.2 0-12 4.2-12 10.2 0 6.6 5.5 8.8 11.8 10.4 6.8 1.7 9.2 3.8 9.2 7.8 0 5-4.6 8.6-11.5 8.6-6.2 0-10.8-2.6-13.5-7.2m-3 0l-1.5 2.5" 
        stroke="url(#sGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Cyan highlight dot -->
  <circle cx="43" cy="21" r="2.5" fill="#38bdf8" />
  <circle cx="21" cy="46" r="2.5" fill="#fb7185" />
</svg>
